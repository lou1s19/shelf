[package]
name = "cap-audio"
version = "0.1.0"
edition = "2024"

# Edition 2024 merges all doctests of a crate into one binary and runs it, even
# when every example is `no_run`. That binary lands in a temp directory, and the
# bundled ffmpeg libraries are linked as `@executable_path/../Frameworks/...`,
# so it cannot start: `cargo test --workspace` ends in a dyld error instead of a
# result. The crate's only example is `no_run` and was never executed anyway.
[lib]
doctest = false


[dependencies]
ffmpeg = { workspace = true }
cpal = { workspace = true }
tokio.workspace = true
tracing = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[target.'cfg(target_os = "macos")'.dependencies]
cidre = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Devices_FunctionDiscovery",
    "Win32_UI_Shell_PropertiesSystem",
] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
